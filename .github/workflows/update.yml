name: Auto Generate Toffee Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'  # এই কোডটির মানে হলো প্রতি ১ ঘণ্টা পরপর (Minute 0 of every hour) রান করবে

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Main Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Checkout Private Script Repository
        uses: actions/checkout@v4
        with:
          repository: shakil951/toffee-pvt-code
          token: ${{ secrets.PAT_TOKEN }}
          path: private_script_dir

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytz

      - name: Move Script to Root
        run: |
          cp private_script_dir/toffee_auto_scraper.py .
          rm -rf private_script_dir

      - name: Run Toffee Extractor Script
        env:
          BEARER_TOKEN: ${{ secrets.BEARER_TOKEN }}
        run: python toffee_auto_scraper.py

      - name: Remove Python Script
        run: rm -f toffee_auto_scraper.py

      - name: Commit and Push Changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add toffee_channels.json toffee_channels.m3u
          git commit -m "Auto Update Toffee Playlist: $(TZ='Asia/Dhaka' date +'%Y-%m-%d %r')" || exit 0
          git push
