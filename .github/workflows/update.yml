name: Update Toffee Playlist

on:
  schedule:
    - cron: '0 */1 * * *' # প্রতি ৬ ঘণ্টা পর পর অটোমেটিক রান হবে
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run scraper script
        run: python toffee_auto_scraper.py

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add toffee_channels.json toffee_channels.m3u
          git commit -m "Auto-update Toffee 70+ channels and M3U playlist [skip ci]" || exit 0
          git push
