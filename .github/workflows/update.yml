name: Auto Update Toffee Channels

on:
  schedule:
    # বাংলাদেশ সময় অনুযায়ী প্রতি ৪ ঘণ্টা পর পর স্বয়ংক্রিয়ভাবে রান হবে
    - cron: '0 */4 * * *'
  workflow_dispatch: # গিটহাব ড্যাশবোর্ড থেকে যে কোনো সময় ম্যানুয়ালি রান করার অপশন

concurrency:
  group: toffee-update-pipeline
  cancel-in-progress: true

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    permissions:
      contents: write # ফাইল পুশ করার পারমিশন

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Auto Scraper
        run: |
          python toffee_auto_scraper.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # JSON ফাইল ট্র্যাকিংয়ে নেওয়া
          git add toffee_channels.json
          
          # কোনো পরিবর্তন থাকলে কমিট ও পুশ করবে, লুপ ঠেকাতে [skip ci] ট্যাগ ব্যবহার করা হয়েছে
          if git diff --staged --quiet; then
            echo "No updates detected in channel streams."
          else
            git commit -m "Auto-update Toffee channel streams & cookies [skip ci]"
            git push origin HEAD:${{ github.ref }}
          fi
